<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ingresar a RivaStock en el celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DD3B8}a:hover{color:#5FC2A5}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #121212; color: #F2F2F2; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 20px 28px 20px">
  <div style="display: flex; align-items: center; gap: 10px">
    <div style="width: 32px; height: 32px; border-radius: 8px; background: #F2F2F2; color: #121212; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">R</div>
    <span style="font-size: 18px; font-weight: 600; letter-spacing: -0.02em">RivaStock</span>
  </div>

  <div style="margin-top: 72px; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em">Ingresá a tu cuenta</h1>
    <p style="margin: 0; font-size: 15px; color: #A7A7A7">Tu comercio, en orden.</p>
  </div>

  <form style="margin-top: 36px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="email-cel" style="font-size: 13px; font-weight: 500; color: #A7A7A7">Email</label>
      <input id="email-cel" type="email" inputmode="email" autocomplete="email" placeholder="tu@email.com" style="height: 50px; border: 1px solid #2B2B2B; border-radius: 8px; background: #202020; padding: 0 14px; font-size: 16px; font-family: 'Hanken Grotesk', sans-serif; color: #F2F2F2">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="clave-cel" style="font-size: 13px; font-weight: 500; color: #A7A7A7">Contraseña</label>
      <div style="display: flex; align-items: center; height: 50px; border: 1px solid #2B2B2B; border-radius: 8px; background: #202020; padding: 0 4px 0 14px">
        <input id="clave-cel" type="password" autocomplete="current-password" value="12345678" style="flex: 1; border: none; background: transparent; font-size: 16px; font-family: 'Hanken Grotesk', sans-serif; color: #F2F2F2; outline: none; min-width: 0">
        <button type="button" aria-label="Mostrar contraseña" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A7A7A7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <a href="#" style="align-self: flex-end; font-size: 14px; font-weight: 500; padding: 8px 0">¿Te la olvidaste?</a>
    </div>

    <button type="submit" style="height: 52px; border: none; border-radius: 8px; background: #F2F2F2; color: #121212; font-size: 16px; font-weight: 600; font-family: 'Hanken Grotesk', sans-serif; cursor: pointer">Ingresar</button>
  </form>

  <div style="margin-top: auto; border-top: 1px solid #262626; padding-top: 18px; display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 14px; color: #A7A7A7">¿No tenés cuenta?</span>
    <a href="#" style="font-size: 14px; font-weight: 600; padding: 10px 0">Pedila por WhatsApp</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
