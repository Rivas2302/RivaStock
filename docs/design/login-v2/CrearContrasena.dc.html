<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Primer ingreso: creá tu contraseña</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D5E50}a:hover{color:#23705F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #FFFFFF; color: #191919; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 20px">
  <div style="display: flex; align-items: center; gap: 10px">
    <div style="width: 32px; height: 32px; border-radius: 8px; background: #191919; color: #FFFFFF; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">R</div>
    <span style="font-size: 18px; font-weight: 600; letter-spacing: -0.02em">RivaStock</span>
  </div>

  <div style="margin-top: 56px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; color: #6B6B6B">Bienvenida, Bazar Lucía</span>
    <h1 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em">Creá tu contraseña</h1>
    <p style="margin: 0; font-size: 15px; color: #6B6B6B">La vas a usar para entrar desde la PC o el celular.</p>
  </div>

  <form style="margin-top: 32px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="email-fijo" style="font-size: 13px; font-weight: 500">Email</label>
      <input id="email-fijo" type="email" value="bazarlucia@gmail.com" readonly style="height: 50px; border: 1px solid #EDEDEC; border-radius: 8px; background: #FAFAF9; padding: 0 14px; font-size: 16px; font-family: 'Hanken Grotesk', sans-serif; color: #6B6B6B">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="nueva" style="font-size: 13px; font-weight: 500">Contraseña nueva</label>
      <input id="nueva" type="password" autocomplete="new-password" value="lucia2026" style="height: 50px; border: 1px solid #E8E8E6; border-radius: 8px; background: #F4F4F3; padding: 0 14px; font-size: 16px; font-family: 'Hanken Grotesk', sans-serif; color: #191919">
      <ul style="list-style: none; margin: 4px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
        <li style="display: flex; align-items: center; gap: 8px; color: #1D5E50">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D5E50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
          8 caracteres o más
        </li>
        <li style="display: flex; align-items: center; gap: 8px; color: #1D5E50">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D5E50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
          Al menos un número
        </li>
      </ul>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="repetir" style="font-size: 13px; font-weight: 500">Repetila</label>
      <input id="repetir" type="password" autocomplete="new-password" value="lucia2026" style="height: 50px; border: 1px solid #E8E8E6; border-radius: 8px; background: #F4F4F3; padding: 0 14px; font-size: 16px; font-family: 'Hanken Grotesk', sans-serif; color: #191919">
    </div>

    <button type="submit" style="height: 52px; border: none; border-radius: 8px; background: #191919; color: #FFFFFF; font-size: 16px; font-weight: 600; font-family: 'Hanken Grotesk', sans-serif; cursor: pointer">Crear contraseña y entrar</button>
  </form>

  <p style="margin: auto 0 0 0; font-size: 13px; line-height: 1.5; color: #6B6B6B">¿Algún problema? <a href="#" style="font-weight: 600">Escribinos por WhatsApp</a></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
