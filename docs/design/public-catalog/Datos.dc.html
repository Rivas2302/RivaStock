<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tus datos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B4E96;text-decoration:none}a:hover{color:#1E3F86}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F4F5F7; color: #15171C; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; position: relative; overflow: hidden">
  <header style="position: absolute; left: 0; right: 0; top: 0; height: 68px; padding: 0 16px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #E1E4EA; display: flex; align-items: center; gap: 10px; z-index: 2">
    <a href="Carrito.dc.html" aria-label="Volver al carrito" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: #EEF0F3; color: #15171C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 700; text-align: center">Tus datos</span>
    <a href="Carrito.dc.html" aria-label="Ver carrito, 2 productos" style="position: relative; flex: none; width: 44px; height: 44px; border-radius: 22px; background: #EEF0F3; color: #15171C; display: flex; align-items: center; justify-content: center"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg><span style="position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: {{accent}}; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span></a>
  </header>
  <main style="position: absolute; left: 0; right: 0; top: 68px; bottom: 0; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 18px 16px 120px">
    <ol aria-label="Pasos" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <li style="height: 6px; border-radius: 3px; background: {{accent}}"></li><li style="height: 6px; border-radius: 3px; background: {{accent}}"></li><li style="height: 6px; border-radius: 3px; background: #E1E4EA"></li>
    </ol>
    <p style="margin: 0; font-size: 15px; color: #353A44">Completá tus datos y te escribimos por WhatsApp para coordinar el pago y la entrega.</p>
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 600">Nombre y apellido</span>
        <input type="text" placeholder="Ej.: Laura Gómez" style="height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid #CDD2DB; background: #FFFFFF; color: #15171C; font: inherit; font-size: 16px; outline: none"></label>
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 600">WhatsApp</span>
        <input type="tel" inputmode="tel" placeholder="Ej.: 11 2345-6789" style="height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid #CDD2DB; background: #FFFFFF; color: #15171C; font: inherit; font-size: 16px; outline: none"></label>
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600">¿Cómo lo recibís?</legend>
      <div role="radiogroup" aria-label="Forma de entrega" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" role="radio" aria-checked="true" style="height: 64px; border-radius: 14px; border: 2px solid {{accent}}; background: #EAF0FB; color: #15171C; font: inherit; font-size: 14px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h11v10H3ZM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg>Envío</button>
        <button type="button" role="radio" aria-checked="false" style="height: 64px; border-radius: 14px; border: 1px solid #E1E4EA; background: #FFFFFF; color: #353A44; font: inherit; font-size: 14px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16l-1-5H5Z"/><path d="M5 9v11h14V9M9 20v-6h6v6"/></svg>Retiro en el local</button>
      </div>
    </fieldset>
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 600">Dirección de entrega</span>
        <input type="text" placeholder="Calle, número, localidad" style="height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid #CDD2DB; background: #FFFFFF; color: #15171C; font: inherit; font-size: 16px; outline: none"></label>
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 600">Notas <span style="font-weight: 400; color: #5B616D">(opcional)</span></span>
      <textarea rows="2" placeholder="Ej.: color preferido, horario para recibir" style="padding: 12px 14px; border-radius: 14px; border: 1px solid #CDD2DB; background: #FFFFFF; color: #15171C; font: inherit; font-size: 16px; outline: none; resize: none"></textarea></label>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E4EA"><span style="font-size: 14px; color: #353A44">2 productos</span><span style="font-size: 18px; font-weight: 800">$ 47.500</span></div>
  </main>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 20px; background: #FFFFFF; border-top: 1px solid #E1E4EA">
    <a href="Enviado.dc.html" style="height: 52px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Enviar pedido</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#365FAD","options":["#365FAD","#0F766E","#B4232C","#1F2937"]},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#365FAD' };
  }
}
</script>
</body>
</html>
