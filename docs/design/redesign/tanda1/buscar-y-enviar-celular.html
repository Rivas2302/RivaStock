<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boceto · Buscar y enviar (Celular)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap">
<style>
/*
INVENTARIO DE FUNCIONES — Buscar y enviar CELULAR (ProductPhotos.tsx)
══════════════════════════════════════════════
(mismo inventario que buscar-y-enviar-pc.html — adaptado a 390px)

LAYOUT MÓVIL
  - Sticky header con buscador + escanear
  - Scroll de chips de colección
  - Grid 2 columnas con tarjetas
  - Barra de acción sticky en fondo: contador + Compartir
  - Bottom sheet de fotos seleccionadas (swipe up)
  - Bottom nav (5 destinos)

TOQUE EN TARJETA
  - 1er toque → selecciona, muestra check overlay
  - Carrusel de fotos en la propia tarjeta al seleccionar (swipe)
  - Corazón favorito en esquina sup-der
  - Contador global actualiza en la barra fija

BOTTOM SHEET (fotos)
  - Swipe handle
  - Lista de fotos seleccionadas (previews agrupados por producto)
  - Lista de precios (select)
  - Botón Compartir (nativo)
  - Botón Crear texto

SHARE NATIVO (iOS)
  - navigator.share() con array de File (imágenes)
  - Fallback: botón descargar
══════════════════════════════════════════════
*/

*{box-sizing:border-box}
body{margin:0;padding:0;background:#E5E5E5}
.t-claro{--bg:#FFFFFF;--s1:#FAFAF9;--s2:#F4F4F3;--s3:#E8E8E6;--ink:#191919;--ink2:#6B6B6B;--ink3:#A3A3A3;--line:#EDEDEC;--acc:#23705F;--acc-ink:#FFFFFF;--acc-soft:#E3F1EC;--acc-text:#1D5E50;--danger:#C4382B;--danger-soft:#FBEDEB;--warn:#A86F0C;--warn-soft:#FBF3E2;--bar:#DEDEDB;--pri:#191919;--pri-ink:#FFFFFF}
.t-oscuro{--bg:#121212;--s1:#181818;--s2:#202020;--s3:#2B2B2B;--ink:#F2F2F2;--ink2:#A7A7A7;--ink3:#6A6A6A;--line:#262626;--acc:#5FC2A5;--acc-ink:#0E2A22;--acc-soft:#16352D;--acc-text:#7DD3B8;--danger:#F07B6E;--danger-soft:#3A1F1C;--warn:#E0A84A;--warn-soft:#3A2D14;--bar:#333333;--pri:#F2F2F2;--pri-ink:#121212}

.btn-acc{height:48px;padding:0 20px;border-radius:8px;border:0;background:var(--acc);color:var(--acc-ink);font:inherit;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.btn-acc:disabled{opacity:.4;cursor:default}
.btn-sec{height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
.chip-coll{height:32px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink2);font:inherit;font-size:13px;font-weight:500;cursor:pointer;flex-shrink:0}
.chip-coll-on{border-color:var(--pri);background:var(--pri);color:var(--pri-ink)}
.money-sign{font-size:11px;opacity:.5;vertical-align:.25em;margin-right:1px}
.tema-toggle{position:fixed;right:12px;top:68px;z-index:99;height:30px;padding:0 10px;border-radius:15px;border:1px solid #999;background:#fff;color:#111;font:500 11px system-ui;cursor:pointer}

.phone{width:390px;min-height:844px;margin:20px auto;background:var(--bg);border-radius:40px;border:8px solid #111;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative}
</style>
</head>
<body style="padding:20px">
<button type="button" class="tema-toggle" onclick="var p=document.getElementById('p');var o=p.classList.contains('t-oscuro');p.classList.toggle('t-oscuro',!o);p.classList.toggle('t-claro',o)">Cambiar claro / oscuro</button>

<div id="p" class="t-claro phone" style="font-family:'Hanken Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink)">

  <!-- Header sticky -->
  <header style="padding:12px 16px;border-bottom:1px solid var(--line);background:var(--s1);flex-shrink:0;position:sticky;top:0;z-index:10">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="color:var(--acc);flex-shrink:0"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <h1 style="margin:0;font-size:16px;font-weight:600;flex:1">Buscar y enviar</h1>
      <button type="button" aria-label="Escanear código" style="width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M4 12h16"/></svg>
      </button>
    </div>
    <!-- Búsqueda -->
    <div style="position:relative">
      <svg style="position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink3)" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" placeholder="Buscar por nombre o código…" style="width:100%;height:40px;padding:0 12px 0 34px;border-radius:8px;border:1px solid var(--line);background:var(--s2);color:var(--ink);font:inherit;font-size:14px;outline:none">
    </div>
  </header>

  <!-- Chips colección (scroll horizontal) -->
  <div style="display:flex;gap:7px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--line);flex-shrink:0;scrollbar-width:none">
    <button type="button" class="chip-coll chip-coll-on" aria-pressed="true">Todos</button>
    <button type="button" class="chip-coll" aria-pressed="false">Recientes</button>
    <button type="button" class="chip-coll" aria-pressed="false">Favoritos</button>
  </div>

  <!-- Grid de productos (2 col) -->
  <div style="flex:1;overflow-y:auto;padding:12px 16px 90px">
    <p style="margin:0 0 10px;font-size:12px;color:var(--ink3);font-weight:500">12 productos</p>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">

      <!-- Tarjeta 1: seleccionada -->
      <div style="background:var(--s1);border:2px solid var(--acc);border-radius:10px;overflow:hidden;position:relative;cursor:pointer">
        <div style="position:absolute;top:7px;left:7px;width:20px;height:20px;border-radius:999px;background:var(--acc);display:flex;align-items:center;justify-content:center;z-index:2">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <button type="button" aria-pressed="false" aria-label="Favorito" style="position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:999px;border:0;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.84 4.6a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <div style="height:110px;background:var(--s2);display:flex;align-items:center;justify-content:center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true" style="color:var(--ink3)"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </div>
        <div style="position:absolute;bottom:52px;left:7px;background:rgba(0,0,0,.55);color:#fff;border-radius:5px;padding:1px 6px;font-size:10px;font-weight:600">📷 4</div>
        <div style="padding:8px">
          <p style="margin:0 0 1px;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Auriculares BT M20</p>
          <p style="margin:0 0 1px;font-size:13px;font-weight:700"><span class="money-sign">$</span>18.500</p>
          <p style="margin:0;font-size:11px;color:var(--acc-text);font-weight:500">Stock: 24</p>
        </div>
      </div>

      <!-- Tarjeta 2: seleccionada + favorito -->
      <div style="background:var(--s1);border:2px solid var(--acc);border-radius:10px;overflow:hidden;position:relative;cursor:pointer">
        <div style="position:absolute;top:7px;left:7px;width:20px;height:20px;border-radius:999px;background:var(--acc);display:flex;align-items:center;justify-content:center;z-index:2">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <button type="button" aria-pressed="true" aria-label="Quitar favorito" style="position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:999px;border:0;background:var(--acc-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="color:var(--acc)"><path d="M20.84 4.6a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <div style="height:110px;background:var(--s2);display:flex;align-items:center;justify-content:center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true" style="color:var(--ink3)"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </div>
        <div style="position:absolute;bottom:52px;left:7px;background:rgba(0,0,0,.55);color:#fff;border-radius:5px;padding:1px 6px;font-size:10px;font-weight:600">📷 2</div>
        <div style="padding:8px">
          <p style="margin:0 0 1px;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Cable iPhone Rápida</p>
          <p style="margin:0 0 1px;font-size:13px;font-weight:700"><span class="money-sign">$</span>4.200</p>
          <p style="margin:0;font-size:11px;color:var(--acc-text);font-weight:500">Stock: 12</p>
        </div>
      </div>

      <!-- Tarjeta 3: sin stock -->
      <div style="background:var(--s1);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;cursor:pointer;opacity:.6">
        <button type="button" aria-pressed="false" aria-label="Favorito" style="position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:999px;border:0;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.84 4.6a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <div style="height:110px;background:var(--s2);display:flex;align-items:center;justify-content:center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true" style="color:var(--ink3)"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </div>
        <div style="padding:8px">
          <p style="margin:0 0 1px;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Cable HDMI 1.5m</p>
          <p style="margin:0 0 1px;font-size:13px;font-weight:700"><span class="money-sign">$</span>5.100</p>
          <p style="margin:0;font-size:11px;color:var(--danger);font-weight:500">Sin stock</p>
        </div>
      </div>

      <!-- Tarjeta 4: normal -->
      <div style="background:var(--s1);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;cursor:pointer">
        <button type="button" aria-pressed="false" aria-label="Favorito" style="position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:999px;border:0;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.84 4.6a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <div style="height:110px;background:var(--s2);display:flex;align-items:center;justify-content:center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true" style="color:var(--ink3)"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </div>
        <div style="position:absolute;bottom:52px;left:7px;background:rgba(0,0,0,.55);color:#fff;border-radius:5px;padding:1px 6px;font-size:10px;font-weight:600">📷 1</div>
        <div style="padding:8px">
          <p style="margin:0 0 1px;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Parlante BT Vibe</p>
          <p style="margin:0 0 1px;font-size:13px;font-weight:700"><span class="money-sign">$</span>21.000</p>
          <p style="margin:0;font-size:11px;color:var(--acc-text);font-weight:500">Stock: 7</p>
        </div>
      </div>

    </div>
  </div>

  <!-- Barra de acción sticky (encima del bottom nav) -->
  <div style="position:absolute;bottom:64px;left:0;right:0;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:8">
    <div style="flex:1">
      <p style="margin:0;font-size:13px;font-weight:600">6 fotos seleccionadas</p>
      <p style="margin:0;font-size:12px;color:var(--ink2)">2 productos · tap para ver</p>
    </div>
    <button type="button" class="btn-acc" style="height:44px;padding:0 18px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
      Compartir
    </button>
  </div>

  <!-- Bottom nav -->
  <nav aria-label="Navegación principal" style="display:flex;border-top:1px solid var(--line);background:var(--s1);flex-shrink:0;padding-bottom:16px;z-index:9">
    <a href="#" aria-label="Inicio" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 4px;text-decoration:none;color:var(--ink3);gap:4px;font-size:10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Inicio
    </a>
    <a href="#" aria-label="Stock" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 4px;text-decoration:none;color:var(--ink3);gap:4px;font-size:10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h8"/></svg>
      Stock
    </a>
    <a href="#" aria-label="Ventas" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 4px;text-decoration:none;color:var(--ink3);gap:4px;font-size:10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/></svg>
      Ventas
    </a>
    <a href="#" aria-label="Clientes" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 4px;text-decoration:none;color:var(--ink3);gap:4px;font-size:10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Clientes
    </a>
    <a href="#" aria-current="page" aria-label="Enviar" style="flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 4px;text-decoration:none;color:var(--acc);gap:4px;font-size:10px;font-weight:600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      Enviar
    </a>
  </nav>

</div>
</body>
</html>
